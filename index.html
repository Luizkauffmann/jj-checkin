<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliance Jiu Jitsu Cary</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0d0d0d; --white: #f5f0e8; --red: #c0392b; --red-dark: #922b21;
    --gold: #d4a017; --gray: #2a2a2a; --gray2: #3a3a3a; --gray3: #555;
    --text-muted: #888; --radius: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header { background: var(--black); border-bottom: 2px solid var(--red); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .header-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 2px; line-height: 1; }
  .header-text h1 span { color: var(--red); }
  .header-text p { font-size: 11px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 3px; }

  /* MAIN */
  .main { padding: 20px 24px; max-width: 500px; }



  /* MONTH NAV */
  .month-nav { display: flex; align-items: center; margin-bottom: 20px; border: 1px solid var(--gray2); border-radius: var(--radius); overflow: hidden; }
  .month-nav button { background: var(--gray); border: none; color: var(--text-muted); font-size: 18px; padding: 10px 16px; cursor: pointer; }
  .month-nav button:hover { background: var(--gray2); color: var(--white); }
  .month-name { flex: 1; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; background: var(--gray); padding: 10px 0; }

  /* METRICS */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .metric { background: var(--gray); border-radius: var(--radius); padding: 14px 10px; text-align: center; border: 1px solid var(--gray2); }
  .metric .num { font-family: 'Bebas Neue', sans-serif; font-size: 36px; line-height: 1; }
  .metric.highlight .num { color: var(--red); }
  .metric .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

  /* CLASS BUTTONS */
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .class-btns { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  .class-btn { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--gray); border: 1px solid var(--gray2); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 15px; transition: background 0.15s, transform 0.1s; position: relative; overflow: hidden; }
  .class-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gray3); }
  .class-btn:hover:not(:disabled) { background: var(--gray2); transform: translateX(2px); }
  .class-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .class-btn.has-entries::before { background: var(--red); }
  .class-btn.has-entries { border-color: rgba(192,57,43,0.35); }
  .btn-label { flex: 1; text-align: left; }
  .btn-sub { font-size: 12px; color: var(--text-muted); }
  .count-badge { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--text-muted); min-width: 28px; text-align: right; }
  .class-btn.has-entries .count-badge { color: var(--red); }

  /* LOG */
  .log-section { background: var(--gray); border: 1px solid var(--gray2); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .log-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--gray2); }
  .log-header span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
  .log-body { max-height: 200px; overflow-y: auto; }
  .log-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; color: #bbb; }
  .log-item:last-child { border-bottom: none; }
  .log-date { color: var(--white); font-weight: 500; }
  .log-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tag-morning { background: rgba(212,160,23,0.15); color: var(--gold); }
  .tag-evening { background: rgba(24,95,165,0.2); color: #7eb8f5; }
  .log-empty { padding: 20px 14px; font-size: 13px; color: var(--text-muted); text-align: center; }

  /* STATUS */
  .status { font-size: 12px; color: var(--text-muted); text-align: center; padding: 6px 0; min-height: 26px; }
  .status.ok { color: #5dca95; } .status.err { color: #e88; } .status.loading { color: var(--gold); }
  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SUMMARY BTN */
  .summary-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: var(--red); border: none; border-radius: var(--radius); color: var(--white); font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; cursor: pointer; margin-bottom: 20px; }
  .summary-btn:hover { background: var(--red-dark); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--gray); border: 1px solid var(--gray2); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 400px; }
  .modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; margin-bottom: 14px; }
  .modal pre { background: var(--black); border-radius: var(--radius); padding: 14px; font-size: 13px; color: #ccc; white-space: pre-wrap; line-height: 1.6; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: var(--radius); cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; border: none; }
  .btn-copy { background: var(--red); color: var(--white); } .btn-copy:hover { background: var(--red-dark); }
  .btn-close { background: var(--gray2); color: var(--white); } .btn-close:hover { background: #444; }


  .footer { font-size: 11px; color: var(--gray3); text-align: center; padding: 4px 0 28px; }
</style>
</head>
<body>

<div class="header">
  <svg width="54" height="54" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,3 97,91 3,91" fill="#f5f0e8"/>
    <polygon points="50,16 85,84 15,84" fill="#0d0d0d"/>
    <path d="M50 28 C43 35 37 42 37 51 C37 58 42 63 50 67 C58 63 63 58 63 51 C63 42 57 35 50 28Z" fill="#f5f0e8"/>
    <path d="M37 51 C30 48 23 49 19 53 C24 57 32 55 37 51Z" fill="#f5f0e8"/>
    <path d="M63 51 C70 48 77 49 81 53 C76 57 68 55 63 51Z" fill="#f5f0e8"/>
    <path d="M46 64 C44 70 45 76 50 78 C55 76 56 70 54 64 C52 66 48 66 46 64Z" fill="#f5f0e8"/>
  </svg>
  <div class="header-text">
    <h1>Alliance <span>Jiu Jitsu</span></h1>
    <p>Cary &nbsp;·&nbsp; Class Tracker</p>
  </div>
</div>

<div class="main">



  <div class="month-nav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <div class="month-name" id="month-name"></div>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>

  <div class="metrics">
    <div class="metric highlight"><div class="num" id="m-total">0</div><div class="lbl">Total</div></div>
    <div class="metric"><div class="num" id="m-morning">0</div><div class="lbl">Mornings</div></div>
    <div class="metric"><div class="num" id="m-evening">0</div><div class="lbl">Evenings</div></div>
  </div>

  <div class="section-label">Tuesday</div>
  <div class="class-btns">
    <button class="class-btn" id="btn-tue-morning" onclick="checkIn('tue-morning')">
      <span style="font-size:18px">🌅</span>
      <div class="btn-label"><div>Morning class</div><div class="btn-sub">Tuesday AM</div></div>
      <span class="count-badge" id="c-tue-morning">0</span>
    </button>
    <button class="class-btn" id="btn-tue-evening" onclick="checkIn('tue-evening')">
      <span style="font-size:18px">🌙</span>
      <div class="btn-label"><div>Evening class</div><div class="btn-sub">Tuesday PM</div></div>
      <span class="count-badge" id="c-tue-evening">0</span>
    </button>
  </div>

  <div class="section-label">Thursday</div>
  <div class="class-btns">
    <button class="class-btn" id="btn-thu-morning" onclick="checkIn('thu-morning')">
      <span style="font-size:18px">🌅</span>
      <div class="btn-label"><div>Morning class</div><div class="btn-sub">Thursday AM</div></div>
      <span class="count-badge" id="c-thu-morning">0</span>
    </button>
  </div>

  <div class="log-section">
    <div class="log-header">
      <span>Session log</span>
      <span id="log-hint">tap a class to check in</span>
    </div>
    <div class="log-body" id="log-body">
      <div class="log-empty">No classes logged yet this month.</div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <button class="summary-btn" onclick="showSummary()">📋 &nbsp;Monthly Summary</button>


  <div class="footer">Data saves to your Google Sheet · URL stored in your browser only · Free forever</div>
</div>

<!-- SUMMARY MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>📋 Monthly Summary</h2>
    <pre id="summary-text"></pre>
    <div class="modal-actions">
      <button class="btn-copy" onclick="copySummary()">Copy</button>
      <button class="btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const LABELS = {'tue-morning':'Tue Morning','tue-evening':'Tue Evening','thu-morning':'Thu Morning'};
const SES_TYPE = {'tue-morning':'morning','tue-evening':'evening','thu-morning':'morning'};
const DAYS = {'tue-morning':'Tuesday','tue-evening':'Tuesday','thu-morning':'Thursday'};

let viewYear = new Date().getFullYear(), viewMonth = new Date().getMonth();
let allEntries = [], busy = false;

function getUrl() { return 'https://script.google.com/macros/s/AKfycbzKBBdm_g1M1MBbnJX04sh5CwNEVEsEc7Lhxx25AZ-zCEzHMf45VbDBiuYinHcCa0B9/exec'; }

function saveScriptUrl() {}

function changeMonth(dir) {
  viewMonth += dir;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
}

async function loadFromSheet() {
  const url = getUrl();
  if (!url) { render(); return; }
  setStatus('<span class="spinner"></span>Loading from Google Sheets...', 'loading');
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Unknown error');
    allEntries = (data.entries || []).map(r => ({
      ...r,
      month: Number(r.month),
      year: Number(r.year),
      type: Object.keys(LABELS).find(k => LABELS[k] === r.session) || 'tue-morning'
    }));
    setStatus('');
  } catch(e) {
    setStatus('⚠ Could not load: ' + e.message, 'err');
  }
  render();
}

async function checkIn(type) {
  if (busy) return;
  const url = getUrl();
  if (!url) { setStatus('⚠ Add your Apps Script URL first (see setup guide below)', 'err'); return; }
  busy = true; setButtons(true);
  setStatus('<span class="spinner"></span>Saving to Google Sheets...', 'loading');

  const today = new Date();
  const entry = {
    date: today.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}),
    day: DAYS[type],
    session: LABELS[type],
    month: today.getMonth() + 1,
    year: today.getFullYear(),
    type
  };

  try {
    const res = await fetch(url, {
      method: 'POST',
      body: JSON.stringify(entry)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Unknown error');
    allEntries.push(entry);
    setStatus('✓ Saved to Google Sheets', 'ok');
    setTimeout(() => setStatus(''), 3000);
  } catch(e) {
    setStatus('⚠ Save failed: ' + e.message, 'err');
  }

  busy = false; setButtons(false);
  render();
}

function setButtons(disabled) {
  ['tue-morning','tue-evening','thu-morning'].forEach(t => {
    document.getElementById('btn-' + t).disabled = disabled;
  });
}

function monthEntries() {
  return allEntries.filter(e => e.month === viewMonth + 1 && e.year === viewYear);
}

function render() {
  document.getElementById('month-name').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const entries = monthEntries();
  const counts = {'tue-morning':0,'tue-evening':0,'thu-morning':0};
  entries.forEach(e => { if (counts[e.type] !== undefined) counts[e.type]++; });
  Object.keys(counts).forEach(t => {
    document.getElementById('c-' + t).textContent = counts[t];
    document.getElementById('btn-' + t).className = 'class-btn' + (counts[t] > 0 ? ' has-entries' : '');
  });
  document.getElementById('m-total').textContent = entries.length;
  document.getElementById('m-morning').textContent = entries.filter(e => SES_TYPE[e.type] === 'morning').length;
  document.getElementById('m-evening').textContent = entries.filter(e => SES_TYPE[e.type] === 'evening').length;

  const logBody = document.getElementById('log-body');
  if (!entries.length) {
    logBody.innerHTML = '<div class="log-empty">No classes logged yet this month.</div>';
    return;
  }
  logBody.innerHTML = [...entries].reverse().map(e => {
    const tagCls = SES_TYPE[e.type] === 'morning' ? 'tag-morning' : 'tag-evening';
    return `<div class="log-item">
      <span><span class="log-date">${e.date}</span> &mdash; ${e.session}</span>
      <span class="log-tag ${tagCls}">${SES_TYPE[e.type]}</span>
    </div>`;
  }).join('');
}

function showSummary() {
  const entries = monthEntries();
  const counts = {'tue-morning':0,'tue-evening':0,'thu-morning':0};
  entries.forEach(e => { if (counts[e.type] !== undefined) counts[e.type]++; });
  const total = entries.length;
  const lines = [
    `Alliance Jiu Jitsu Cary \u2014 ${MONTHS[viewMonth]} ${viewYear}`,
    `\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500`,
    `Tuesday Morning:   ${counts['tue-morning']} class${counts['tue-morning'] !== 1 ? 'es' : ''}`,
    `Tuesday Evening:   ${counts['tue-evening']} class${counts['tue-evening'] !== 1 ? 'es' : ''}`,
    `Thursday Morning:  ${counts['thu-morning']} class${counts['thu-morning'] !== 1 ? 'es' : ''}`,
    `\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500`,
    `Total: ${total} class${total !== 1 ? 'es' : ''}`, ''
  ];
  if (entries.length) {
    lines.push('Dates taught:');
    entries.forEach(e => lines.push(`  \u2022 ${e.date} \u2014 ${e.session}`));
  }
  document.getElementById('summary-text').textContent = lines.join('\n');
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

function copySummary() {
  navigator.clipboard.writeText(document.getElementById('summary-text').textContent).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  });
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

loadFromSheet();
</script>
</body>
</html>
