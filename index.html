<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiu Jitsu Class Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #edede9;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.2);
    --success-bg: #eaf3de; --success-text: #3b6d11; --success-border: rgba(59,109,17,0.3);
    --warning-bg: #faeeda; --warning-text: #854f0b;
    --info-bg: #e6f1fb; --info-text: #185fa5;
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0ede8; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --success-bg: #173404; --success-text: #c0dd97; --success-border: rgba(192,221,151,0.3);
      --warning-bg: #412402; --warning-text: #fac775;
      --info-bg: #042c53; --info-text: #b5d4f4;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding: 16px; }
  .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; font-weight: 500; color: var(--text); }
  h1 span { font-size: 13px; font-weight: 400; color: var(--text3); display: block; margin-top: 2px; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
  .section-label { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .class-btn { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px 14px; cursor: pointer; font-size: 15px; color: var(--text); margin-bottom: 8px; transition: background 0.15s; }
  .class-btn:hover { background: var(--bg3); }
  .class-btn:last-of-type { margin-bottom: 0; }
  .class-btn.checked { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .class-btn.checked .dot { background: var(--success-text); }
  .lbl { flex: 1; text-align: left; }
  .count { font-size: 13px; padding: 2px 9px; border-radius: 20px; background: var(--bg); border: 0.5px solid var(--border); color: var(--text2); }
  .class-btn.checked .count { background: var(--success-text); color: white; border-color: transparent; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .metric { background: var(--bg2); border-radius: var(--radius); padding: 14px 10px; text-align: center; }
  .metric .num { font-size: 26px; font-weight: 500; color: var(--text); }
  .metric .mlbl { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .month-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .month-nav button { background: none; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 5px 11px; cursor: pointer; color: var(--text2); font-size: 13px; }
  .month-nav button:hover { background: var(--bg2); }
  .month-label { flex: 1; text-align: center; font-size: 15px; font-weight: 500; color: var(--text); }
  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hint { font-size: 12px; color: var(--text3); }
  .log-item { font-size: 13px; color: var(--text2); padding: 7px 0; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .log-item:last-child { border-bottom: none; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; margin-right: 4px; }
  .tag-morning { background: var(--warning-bg); color: var(--warning-text); }
  .tag-evening { background: var(--info-bg); color: var(--info-text); }
  .undo { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; padding: 0 2px; line-height: 1; }
  .undo:hover { color: #e24b4a; }
  .empty { font-size: 13px; color: var(--text3); padding: 8px 0; }
  .copy-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 14px; padding: 11px; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; font-size: 14px; color: var(--text); }
  .copy-btn:hover { background: var(--bg2); }
  .footer { font-size: 12px; color: var(--text3); text-align: center; padding-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>Jiu Jitsu Tracker <span>Check in after each class</span></h1>
  </div>

  <div class="card">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>

    <div class="section-label">Tuesday</div>
    <button class="class-btn" id="btn-tue-morning" onclick="addEntry('tue-morning')">
      <span class="dot"></span><span class="lbl">Morning</span><span class="count" id="c-tue-morning">0</span>
    </button>
    <button class="class-btn" id="btn-tue-evening" onclick="addEntry('tue-evening')">
      <span class="dot"></span><span class="lbl">Evening</span><span class="count" id="c-tue-evening">0</span>
    </button>

    <div class="section-label" style="margin-top:14px;">Thursday</div>
    <button class="class-btn" id="btn-thu-morning" onclick="addEntry('thu-morning')">
      <span class="dot"></span><span class="lbl">Morning</span><span class="count" id="c-thu-morning">0</span>
    </button>
  </div>

  <div class="metrics">
    <div class="metric"><div class="num" id="m-total">0</div><div class="mlbl">Total</div></div>
    <div class="metric"><div class="num" id="m-morning">0</div><div class="mlbl">Mornings</div></div>
    <div class="metric"><div class="num" id="m-evening">0</div><div class="mlbl">Evenings</div></div>
  </div>

  <div class="card">
    <div class="log-header">
      <div class="section-label" style="margin-bottom:0;">Log</div>
      <span class="hint">tap a class to check in</span>
    </div>
    <div id="log-list"><div class="empty">No classes logged this month yet.</div></div>
    <button class="copy-btn" onclick="copyMonthSummary()">&#128203; Copy monthly summary</button>
  </div>

  <div class="footer">Data saved in this browser &mdash; use the same device each time</div>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const LABELS = {'tue-morning':'Tue Morning','tue-evening':'Tue Evening','thu-morning':'Thu Morning'};
const TYPES = {'tue-morning':'morning','tue-evening':'evening','thu-morning':'morning'};

let now = new Date();
let viewYear = now.getFullYear(), viewMonth = now.getMonth();

function key(y,m){ return 'jj_'+y+'_'+m; }
function load(y,m){ try{ return JSON.parse(localStorage.getItem(key(y,m))) || {entries:[]}; }catch(e){ return {entries:[]}; } }
function save(y,m,d){ localStorage.setItem(key(y,m), JSON.stringify(d)); }

function changeMonth(dir){
  viewMonth += dir;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  if(viewMonth<0){viewMonth=11;viewYear--;}
  render();
}

function addEntry(type){
  const d = load(viewYear,viewMonth);
  const now2 = new Date();
  const dateStr = now2.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  d.entries.push({type, date:dateStr, ts:Date.now()});
  save(viewYear,viewMonth,d);
  render();
}

function removeEntry(idx){
  const d = load(viewYear,viewMonth);
  d.entries.splice(idx,1);
  save(viewYear,viewMonth,d);
  render();
}

function render(){
  document.getElementById('month-label').textContent = MONTHS[viewMonth]+' '+viewYear;
  const d = load(viewYear,viewMonth);
  const entries = d.entries||[];
  const counts = {'tue-morning':0,'tue-evening':0,'thu-morning':0};
  entries.forEach(e=>{ if(counts[e.type]!==undefined) counts[e.type]++; });
  Object.keys(counts).forEach(t=>{
    document.getElementById('c-'+t).textContent = counts[t];
    document.getElementById('btn-'+t).className = 'class-btn'+(counts[t]>0?' checked':'');
  });
  const total = entries.length;
  const morning = entries.filter(e=>TYPES[e.type]==='morning').length;
  const evening = entries.filter(e=>TYPES[e.type]==='evening').length;
  document.getElementById('m-total').textContent = total;
  document.getElementById('m-morning').textContent = morning;
  document.getElementById('m-evening').textContent = evening;
  const logEl = document.getElementById('log-list');
  if(!entries.length){ logEl.innerHTML='<div class="empty">No classes logged this month yet.</div>'; return; }
  logEl.innerHTML = [...entries].reverse().map((e,ri)=>{
    const realIdx = entries.length-1-ri;
    const tagCls = TYPES[e.type]==='morning'?'tag-morning':'tag-evening';
    return `<div class="log-item"><span>${e.date} &mdash; ${LABELS[e.type]}</span><div><span class="tag ${tagCls}">${TYPES[e.type]}</span><button class="undo" onclick="removeEntry(${realIdx})" title="Remove">&#x2715;</button></div></div>`;
  }).join('');
}

function copyMonthSummary(){
  const d = load(viewYear,viewMonth);
  const entries = d.entries||[];
  const counts = {'tue-morning':0,'tue-evening':0,'thu-morning':0};
  entries.forEach(e=>{ if(counts[e.type]!==undefined) counts[e.type]++; });
  const total = entries.length;
  let lines = [
    'Jiu Jitsu Classes — '+MONTHS[viewMonth]+' '+viewYear,'',
    'Tuesday Morning: '+counts['tue-morning']+' class'+(counts['tue-morning']!==1?'es':''),
    'Tuesday Evening: '+counts['tue-evening']+' class'+(counts['tue-evening']!==1?'es':''),
    'Thursday Morning: '+counts['thu-morning']+' class'+(counts['thu-morning']!==1?'es':''),'',
    'Total: '+total+' class'+(total!==1?'es':''),''
  ];
  if(entries.length){ lines.push('Dates:'); entries.forEach(e=>lines.push('  '+e.date+' — '+LABELS[e.type])); }
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ Copied!';
    setTimeout(()=>{ btn.innerHTML='&#128203; Copy monthly summary'; },2000);
  }).catch(()=>{ alert(text); });
}

render();
</script>
</body>
</html>
